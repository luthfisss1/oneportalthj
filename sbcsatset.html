<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SBC SATSET v2.6</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- SheetJS untuk Export Excel -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <!-- HTML5 QRCode Scanner -->
    <script src="https://unpkg.com/html5-qrcode"></script>

    <style>
        body { background-color: #0b1329; color: #e2e8f0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .card-dark { background-color: #111c38; border: 1px solid #1e2d54; }
        .input-dark { background-color: #0b1329; border: 1px solid #1e2d54; color: #fff; }
        .input-dark:focus { border-color: #0088ff; outline: none; }
        .btn-blue { background-color: #0088ff; color: #fff; }
        .btn-blue:hover { background-color: #0066cc; }
        #reader video { object-fit: cover !important; border-radius: 12px; }
    </style>
</head>
<body class="pb-24">

    <!-- HEADER / NAVIGATION -->
    <div class="p-4 card-dark sticky top-0 z-40 flex items-center justify-between border-b border-slate-800">
        <div class="flex items-center space-x-3">
            <div class="bg-sky-500 text-slate-950 font-black px-2.5 py-1 rounded-lg text-sm">SBC</div>
            <div>
                <h1 class="font-bold text-sm tracking-wide">SATSET v2.6</h1>
                <p class="text-xs text-sky-400 font-medium" id="displayCabang">Cabang: XCIH</p>
            </div>
        </div>
        <div class="flex space-x-2">
            <button onclick="restoreFromCloud()" class="bg-emerald-950/80 text-emerald-400 text-xs px-3 py-1.5 rounded-lg border border-emerald-700/50 flex items-center space-x-1 hover:bg-emerald-900">
                <i data-lucide="cloud-download" class="w-3.5 h-3.5"></i>
                <span>Pulihkan</span>
            </button>
            <button onclick="openBranchModal()" class="bg-sky-500 text-slate-950 font-semibold text-xs px-3 py-1.5 rounded-lg flex items-center space-x-1">
                <i data-lucide="store" class="w-3.5 h-3.5"></i>
                <span>Cabang</span>
            </button>
        </div>
    </div>

    <!-- MAIN CONTAINER -->
    <div class="p-4 space-y-4 max-w-md mx-auto">
        
        <!-- STEP 1: TARIKAN DATA MASTER -->
        <div id="step1Container" class="card-dark p-4 rounded-2xl space-y-3">
            <div class="flex items-center justify-between">
                <h2 class="font-bold text-sm flex items-center space-x-2 text-sky-400">
                    <i data-lucide="database" class="w-4 h-4"></i>
                    <span>Step 1: Tarikan Data Master</span>
                </h2>
                <span class="text-xs text-slate-400" id="masterCount">0 Item</span>
            </div>
            <textarea id="masterDataInput" rows="3" class="w-full input-dark p-3 rounded-xl text-xs font-mono" placeholder="Paste data tarikan master (Kolom 4=SYS, Kolom 9=NAMA)..."></textarea>
            <div class="flex space-x-2">
                <button onclick="processMasterData()" class="flex-1 btn-blue py-2 rounded-xl text-xs font-semibold flex justify-center items-center space-x-1">
                    <i data-lucide="play" class="w-3.5 h-3.5"></i>
                    <span>Proses Master Data</span>
                </button>
            </div>
        </div>

        <!-- STEP 2: INPUT PEMINDAIAN -->
        <div id="step2Container" class="card-dark p-4 rounded-2xl space-y-3">
            <div class="flex items-center justify-between">
                <h2 class="font-bold text-sm flex items-center space-x-2 text-sky-400">
                    <i data-lucide="scan" class="w-4 h-4"></i>
                    <span>Step 2: Input Pemindaian</span>
                </h2>
                <span class="bg-emerald-950 text-emerald-400 border border-emerald-800/60 text-[10px] px-2 py-0.5 rounded-full font-medium">Auto-Consolidate Active</span>
            </div>

            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="text-[11px] text-slate-400 font-medium mb-1 block">LOKASI / RAK</label>
                    <div class="relative">
                        <input type="text" id="inputRack" class="w-full input-dark px-3 py-2.5 rounded-xl text-sm font-semibold uppercase" placeholder="e.g. AW01-03">
                        <button onclick="openScanner('inputRack')" class="absolute right-2 top-2 text-slate-400 hover:text-white p-1">
                            <i data-lucide="camera" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>

                <div>
                    <label class="text-[11px] text-slate-400 font-medium mb-1 block">KODE SKU / BARCODE</label>
                    <div class="relative">
                        <input type="text" id="inputSKU" oninput="lookupSkuSystemInfo(this.value)" class="w-full input-dark px-3 py-2.5 rounded-xl text-sm font-semibold" placeholder="Scan / Ketik SKU...">
                        <button onclick="openScanner('inputSKU')" class="absolute right-2 top-2 text-slate-400 hover:text-white p-1">
                            <i data-lucide="barcode" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>
            </div>

            <!-- LIVE PREVIEW INFO -->
            <div id="skuPreviewBox" class="hidden bg-slate-900/90 border border-slate-800 p-2.5 rounded-xl text-xs">
                <p class="font-bold text-sky-400 truncate" id="previewNamaBarang">-</p>
                <div class="flex justify-between items-center mt-1 text-[11px] text-slate-400">
                    <span>Stok System: <b class="text-white" id="previewSysCount">0</b></span>
                    <span id="previewStatusBadge" class="px-1.5 py-0.5 rounded text-[10px] font-bold"></span>
                </div>
            </div>

            <div class="grid grid-cols-3 gap-2 items-end">
                <div>
                    <label class="text-[11px] text-slate-400 font-medium mb-1 block">QTY FISIK</label>
                    <input type="number" id="inputQty" value="1" min="1" class="w-full input-dark px-3 py-2.5 rounded-xl text-sm text-center font-bold">
                </div>
                <div>
                    <label class="text-[11px] text-slate-400 font-medium mb-1 block">SYS</label>
                    <div id="displaySysQty" class="input-dark px-3 py-2.5 rounded-xl text-sm text-center font-bold text-slate-500">0</div>
                </div>
                <button onclick="saveScanEntry()" class="btn-blue h-[42px] rounded-xl text-xs font-bold flex items-center justify-center space-x-1">
                    <i data-lucide="plus-circle" class="w-4 h-4"></i>
                    <span>SIMPAN SCAN</span>
                </button>
            </div>

            <div class="flex space-x-2 pt-1">
                <label class="flex-1 bg-slate-900 hover:bg-slate-800 border border-slate-800 text-slate-300 py-2 rounded-xl text-xs font-semibold text-center cursor-pointer flex justify-center items-center space-x-1">
                    <i data-lucide="file-up" class="w-3.5 h-3.5"></i>
                    <span>Import TXT/CSV</span>
                    <input type="file" id="fileTxtInput" accept=".txt,.csv" onchange="handleImportScanFile(event)" class="hidden">
                </label>
            </div>
        </div>

        <!-- NAVIGATION BOTTOM BAR -->
        <div class="fixed bottom-0 left-0 right-0 bg-slate-950 border-t border-slate-800 p-2 z-40">
            <div class="max-w-md mx-auto grid grid-cols-4 gap-1 text-center">
                <button onclick="switchTab('step1')" class="py-1.5 text-slate-400 font-medium text-[11px] flex flex-col items-center">
                    <i data-lucide="database" class="w-4 h-4 mb-0.5"></i> Step 1 Master
                </button>
                <button onclick="switchTab('step2')" class="py-1.5 text-sky-400 font-bold text-[11px] flex flex-col items-center">
                    <i data-lucide="scan" class="w-4 h-4 mb-0.5"></i> Step 2 Scan
                </button>
                <button onclick="switchTab('step3')" class="py-1.5 text-slate-400 font-medium text-[11px] flex flex-col items-center">
                    <i data-lucide="calculator" class="w-4 h-4 mb-0.5"></i> Step 3 POS
                </button>
                <button onclick="switchTab('step4')" class="py-1.5 text-slate-400 font-medium text-[11px] flex flex-col items-center">
                    <i data-lucide="alert-triangle" class="w-4 h-4 mb-0.5"></i> Step 4 Untally
                </button>
            </div>
        </div>
    </div>

    <!-- MODAL SCANNER BARCODE KAMERA -->
    <div id="scannerModal" class="fixed inset-0 bg-slate-950/95 z-50 hidden flex flex-col justify-between p-4">
        <div class="flex justify-between items-center pt-2 px-2">
            <span id="scanTargetBadge" class="bg-amber-500/20 text-amber-400 text-xs font-bold px-3 py-1 rounded-full border border-amber-500/40">SCANNING...</span>
            <button onclick="closeScanner()" class="bg-slate-800 text-slate-300 p-2 rounded-full hover:bg-slate-700">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>
        </div>
        
        <div class="my-auto w-full max-w-xs mx-auto overflow-hidden rounded-2xl border-2 border-sky-500/40 relative">
            <div id="reader" class="w-full"></div>
        </div>

        <div class="pb-6 text-center text-xs text-slate-400">
            Arahkan kamera ke kode barcode rak atau barang
        </div>
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyWtrkgMI_65SKNNE2-kE0tvgv0_3CNwOBE4-ww5No1wgKusM5wwu2RbpI_bMZBYjTq/exec";
        let masterSystem = {};
        let scanEntries = [];
        let html5QrCode = null;
        let activeInputTargetId = null;

        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
        });

        // AUTO FILL & SCANNER INTEGRATION
        function openScanner(targetFieldId) {
            activeInputTargetId = targetFieldId;
            const modal = document.getElementById('scannerModal');
            const targetBadge = document.getElementById('scanTargetBadge');
            
            targetBadge.innerText = targetFieldId === 'inputRack' ? 'SCANNING RAK' : 'SCANNING SKU';
            modal.classList.remove('hidden');

            if (!html5QrCode) {
                html5QrCode = new Html5Qrcode("reader");
            }

            const config = { fps: 15, qrbox: { width: 250, height: 150 } };
            
            html5QrCode.start(
                { facingMode: "environment" },
                config,
                onScanSuccess
            ).catch(err => {
                alert("Gagal membuka kamera: " + err);
                closeScanner();
            });
        }

        function onScanSuccess(decodedText, decodedResult) {
            if (!activeInputTargetId) return;

            const targetElement = document.getElementById(activeInputTargetId);
            if (targetElement) {
                // Set nilai otomatis dari hasil barcode scanner
                targetElement.value = decodedText.trim();
                
                // Picu event listener secara otomatis
                targetElement.dispatchEvent(new Event('input', { bubbles: true }));
                targetElement.dispatchEvent(new Event('change', { bubbles: true }));

                closeScanner();

                // Alur otomatis perpindahan fokus & auto-submit
                if (activeInputTargetId === 'inputRack') {
                    const skuInput = document.getElementById('inputSKU');
                    if (skuInput) skuInput.focus();
                } else if (activeInputTargetId === 'inputSKU') {
                    // Jika SKU berhasil di-scan, jalankan pencarian dan simpan otomatis jika diinginkan
                    lookupSkuSystemInfo(decodedText.trim());
                    saveScanEntry();
                }
            }
        }

        function closeScanner() {
            if (html5QrCode && html5QrCode.isScanning) {
                html5QrCode.stop().then(() => {
                    document.getElementById('scannerModal').classList.add('hidden');
                }).catch(() => {
                    document.getElementById('scannerModal').classList.add('hidden');
                });
            } else {
                document.getElementById('scannerModal').classList.add('hidden');
            }
        }

        // LOOKUP SYS DATA REALTIME
        function lookupSkuSystemInfo(sku) {
            const cleanSku = sku.trim();
            const previewBox = document.getElementById('skuPreviewBox');
            const previewNama = document.getElementById('previewNamaBarang');
            const previewSys = document.getElementById('previewSysCount');
            const previewBadge = document.getElementById('previewStatusBadge');
            const displaySysQty = document.getElementById('displaySysQty');

            if (!cleanSku) {
                previewBox.classList.add('hidden');
                displaySysQty.innerText = '0';
                displaySysQty.className = "input-dark px-3 py-2.5 rounded-xl text-sm text-center font-bold text-slate-500";
                return;
            }

            previewBox.classList.remove('hidden');
            if (masterSystem[cleanSku]) {
                const item = masterSystem[cleanSku];
                previewNama.innerText = item.nama;
                previewSys.innerText = item.sys;
                displaySysQty.innerText = item.sys;
                displaySysQty.className = "input-dark px-3 py-2.5 rounded-xl text-sm text-center font-bold text-sky-400 border-sky-500/50";
                
                previewBadge.innerText = "TERDAFTAR";
                previewBadge.className = "px-1.5 py-0.5 rounded text-[10px] font-bold bg-emerald-950 text-emerald-400 border border-emerald-800";
            } else {
                previewNama.innerText = "Barang Luar Master / Baru";
                previewSys.innerText = "0";
                displaySysQty.innerText = "0";
                displaySysQty.className = "input-dark px-3 py-2.5 rounded-xl text-sm text-center font-bold text-amber-500 border-amber-500/50";
                
                previewBadge.innerText = "LUAR MASTER";
                previewBadge.className = "px-1.5 py-0.5 rounded text-[10px] font-bold bg-amber-950 text-amber-400 border border-amber-800";
            }
        }

        // IMPORT FILE TXT / CSV SUPPORT SPACE SEPARATED
        function handleImportScanFile(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const text = e.target.result;
                const lines = text.split(/\r?\n/);
                let addedCount = 0;

                lines.forEach(line => {
                    const trimmedLine = line.trim();
                    if (!trimmedLine) return;

                    // Menggunakan REGEX /\s+/ untuk menangani spasi ganda, tab, atau koma
                    let parts = trimmedLine.includes(',') ? trimmedLine.split(',') : trimmedLine.split(/\s+/);

                    if (parts.length >= 2) {
                        const rack = parts[0].trim();
                        const sku = parts[1].trim();
                        const qty = parts[2] ? parseInt(parts[2].trim(), 10) || 1 : 1;

                        if (sku) {
                            scanEntries.push({ rack, sku, qty, time: new Date().toISOString() });
                            addedCount++;
                        }
                    }
                });

                autoConsolidateScanData();
                alert(`Berhasil mengimpor ${addedCount} data scan!`);
            };
            reader.readAsText(file);
        }

        function saveScanEntry() {
            const rackInput = document.getElementById('inputRack');
            const skuInput = document.getElementById('inputSKU');
            const qtyInput = document.getElementById('inputQty');

            const rack = rackInput.value.trim().toUpperCase();
            const sku = skuInput.value.trim();
            const qty = parseInt(qtyInput.value, 10) || 1;

            if (!rack) { alert("Isikan Lokasi/Rak terlebih dahulu!"); return; }
            if (!sku) { alert("Isikan Kode SKU/Barcode!"); return; }

            scanEntries.push({ rack, sku, qty, time: new Date().toISOString() });
            
            // Auto-Consolidate data langsung
            autoConsolidateScanData();

            // Clear Input SKU & Reset Qty
            skuInput.value = '';
            qtyInput.value = 1;
            lookupSkuSystemInfo('');
            skuInput.focus();
        }

        function autoConsolidateScanData() {
            const consolidated = {};

            scanEntries.forEach(entry => {
                if (!consolidated[entry.sku]) {
                    consolidated[entry.sku] = {
                        sku: entry.sku,
                        qty: 0,
                        racks: new Set()
                    };
                }
                consolidated[entry.sku].qty += entry.qty;
                if (entry.rack) consolidated[entry.sku].racks.add(entry.rack);
            });

            // Re-build consolidated array
            scanEntries = Object.values(consolidated).map(item => ({
                sku: item.sku,
                qty: item.qty,
                rack: Array.from(item.racks).join('/')
            }));
        }

        function processMasterData() {
            const raw = document.getElementById('masterDataInput').value.trim();
            if (!raw) { alert("Masukkan data master tarikan!"); return; }

            const lines = raw.split(/\r?\n/);
            masterSystem = {};
            let count = 0;

            lines.forEach(line => {
                const row = line.split(/\t/);
                if (row.length >= 4) {
                    const sku = row[0] ? row[0].trim() : '';
                    const sysQty = parseInt(row[3], 10) || 0;
                    const nama = row[8] ? row[8].trim() : (row[1] ? row[1].trim() : 'TANPA NAMA');

                    if (sku) {
                        masterSystem[sku] = { sys: sysQty, nama: nama };
                        count++;
                    }
                }
            });

            document.getElementById('masterCount').innerText = `${count} Item`;
            alert(`Master Data Berhasil Dimuat: ${count} SKU`);
        }

        function switchTab(tabId) {
            // Tab Switch Logic
        }

        function restoreFromCloud() {
            // Restore Logic
        }

        function openBranchModal() {
            // Branch Selection Modal
        }
    </script>
</body>
</html>
